# nginx перед livequiz.
#
#   sudo cp nginx-livequiz.conf /etc/nginx/sites-available/livequiz
#   sudo ln -s /etc/nginx/sites-available/livequiz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем TLS:  sudo certbot --nginx -d quiz.example.kz
# certbot сам допишет сюда listen 443 и пути к сертификатам.

upstream livequiz {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.example.kz;   # ← свой домен

    # Загрузка медиа в конструкторе: сервер принимает до 40 МБ, у nginx
    # запас, иначе он оборвёт запрос раньше и участник увидит пустую ошибку.
    client_max_body_size 45m;

    # Медиа отдаёт сам nginx: тридцать мегабайт картинок и звука на шестьдесят
    # телефонов незачем гонять через Node, который в это время держит игру.
    location /media/ {
        alias /opt/livequiz/public/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        alias /opt/livequiz/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # WebSocket игры. Соединение живёт весь вечер и в тихие минуты между
    # турами молчит, поэтому таймауты подняты: разрыв здесь означает, что
    # у зала одновременно погаснут все телефоны.
    location /ws {
        proxy_pass http://livequiz;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://livequiz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
